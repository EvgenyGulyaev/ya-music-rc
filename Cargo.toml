[package]
name = "ya-player"
version = "0.1.1"
edition = "2024"

[dependencies]
directories = "6"
eframe = "0.36"
egui = "0.36"
global-hotkey = "0.8"
md5 = "0.8"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8.3"

[dev-dependencies]
tempfile = "3"
