name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.2. Leave empty to increment patch."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [ -n "${REQUESTED_VERSION:-}" ]; then
            version="${REQUESTED_VERSION#v}"
          else
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            if [ -z "${latest_tag}" ]; then
              version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            else
              raw="${latest_tag#v}"
              IFS='.' read -r major minor patch <<< "${raw}"
              patch="$((patch + 1))"
              version="${major}.${minor}.${patch}"
            fi
          fi

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be semver X.Y.Z, got: ${version}" >&2
            exit 1
          fi

          while git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; do
            IFS='.' read -r major minor patch <<< "${version}"
            patch="$((patch + 1))"
            version="${major}.${minor}.${patch}"
          done

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Create release tag
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "${TAG_NAME}"
          git push origin "${TAG_NAME}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: Ya-Player-macos
            artifact_path: target/release/Ya-Player-macos-*.dmg
          - os: ubuntu-latest
            artifact_name: Ya-Player-linux
            artifact_path: target/release/Ya-Player-linux-x86_64-*.tar.gz
          - os: windows-latest
            artifact_name: Ya-Player-windows
            artifact_path: target/release/Ya-Player-windows-x86_64-*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package-macos.sh

      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: x86_64
        run: scripts/package-linux.sh

      - name: Package Windows
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  publish:
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Ya Music RC ${{ needs.version.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*
